<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPMINI - Teacher Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f0f1a;
            --surface: #1a1a2e;
            --surface2: #16213e;
            --surface3: #1e2140;
            --border: rgba(255,255,255,0.08);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(ellipse at 25% 25%, rgba(79,70,229,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 75%, rgba(6,182,212,0.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===================== LOGIN PAGE ===================== */
        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 40px);
            position: relative; z-index: 1;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 44px 38px;
            box-shadow: var(--shadow);
            width: 100%; max-width: 420px;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1);
        }

        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(79,70,229,0.4);
        }

        .login-title { text-align: center; margin-bottom: 30px; }
        .login-title h1 { color: var(--text); font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .login-title p  { color: var(--text-muted); font-size: 13px; font-family: 'Noto Sans Sinhala', sans-serif; }

        .form-group { margin-bottom: 16px; }

        label {
            display: block; font-size: 13px; font-weight: 500;
            color: var(--text-muted); margin-bottom: 7px;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }

        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 9px; font-size: 14px; color: var(--text);
            outline: none; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        input::placeholder { color: rgba(148,163,184,0.35); font-size: 13px; }

        input:focus {
            border-color: var(--primary);
            background: rgba(79,70,229,0.08);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.14);
        }

        .login-btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 9px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            font-family: 'Noto Sans Sinhala', sans-serif;
            box-shadow: 0 4px 16px rgba(79,70,229,0.4);
            transition: all 0.2s; margin-top: 4px;
        }

        .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,70,229,0.5); }
        .login-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .error-box {
            display: none; color: #fca5a5; font-size: 13px;
            text-align: center; padding: 10px 14px; margin-top: 12px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }

        .info-pill {
            margin-top: 18px; padding: 10px;
            background: rgba(79,70,229,0.08);
            border: 1px solid rgba(79,70,229,0.2);
            border-radius: 8px; text-align: center;
            font-size: 12px; color: #818cf8;
        }

        /* ===================== REPORT PAGE ===================== */
        #reportPage {
            display: none; position: relative; z-index: 1;
            max-width: 920px; margin: 0 auto;
            animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1);
        }

        .rp-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
        }

        .rp-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary) 55%, #7c3aed);
            padding: 22px 28px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 14px; flex-wrap: wrap;
            position: relative; overflow: hidden;
        }

        .rp-header::before {
            content: '';
            position: absolute; top: -50%; right: -8%;
            width: 240px; height: 240px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }

        .rp-left { display: flex; align-items: center; gap: 12px; z-index: 1; }

        .rp-logo {
            width: 42px; height: 42px;
            background: rgba(255,255,255,0.18);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }

        .rp-tag  { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; color: white; }
        .rp-name { font-size: 18px; font-weight: 700; color: white; }

        .logout-btn {
            z-index: 1;
            padding: 9px 18px;
            background: rgba(255,255,255,0.14);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans Sinhala', sans-serif;
            text-decoration: none; display: inline-block;
        }

        .logout-btn:hover  { background: rgba(255,255,255,0.28); }
        .logout-btn:active { transform: scale(0.96); }

        .rp-content { padding: 26px; }

        /* teacher bar */
        .teacher-bar {
            background: rgba(79,70,229,0.08);
            border: 1px solid rgba(79,70,229,0.2);
            border-radius: 12px; padding: 16px 20px;
            margin-bottom: 22px;
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }

        .teacher-avatar {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
        }

        .t-name { color: var(--text); font-size: 17px; font-weight: 700; }
        .t-code { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

        /* summary */
        .sum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(148px,1fr));
            gap: 12px; margin-bottom: 22px;
        }

        .sum-card {
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 18px; text-align: center;
        }

        .sum-card.remaining-card-pending {
            background: rgba(239,68,68,0.08);
            border-color: rgba(239,68,68,0.25);
        }

        .sum-card.remaining-card-overpaid {
            background: rgba(16,185,129,0.08);
            border-color: rgba(16,185,129,0.25);
        }

        .sum-card.remaining-card-settled {
            background: rgba(16,185,129,0.08);
            border-color: rgba(16,185,129,0.25);
        }

        .sum-num { font-size: 26px; font-weight: 700; }
        .sum-lbl { font-size: 12px; color: var(--text-muted); margin-top: 5px; line-height: 1.4; }

        .c-indigo { color: #818cf8; }
        .c-green  { color: #34d399; }
        .c-red    { color: #fca5a5; }
        .c-amber  { color: #fbbf24; }
        .c-cyan   { color: #67e8f9; }

        /* table */
        .tbl-section {
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 13px; overflow: hidden; margin-bottom: 20px;
        }

        .tbl-head { padding: 15px 20px; border-bottom: 1px solid var(--border); }
        .tbl-head h3 { color: #818cf8; font-size: 14px; font-weight: 700; }
        .tbl-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        th {
            background: rgba(79,70,229,0.1);
            color: #a5b4fc; font-weight: 600;
            padding: 11px 16px; text-align: left;
            font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.4px; border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td { padding: 11px 16px; color: var(--text); border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .total-row td { font-weight: 700; background: rgba(79,70,229,0.08); color: #a5b4fc; }
        .balance-row td { font-weight: 700; background: rgba(6,182,212,0.08); color: #67e8f9; }
        .remaining-row-pending td { font-weight: 700; background: rgba(239,68,68,0.08); color: #fca5a5; }
        .remaining-row-overpaid td { font-weight: 700; background: rgba(16,185,129,0.10); color: #34d399; }
        .remaining-row-settled td  { font-weight: 700; background: rgba(16,185,129,0.10); color: #34d399; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-paid   { background: rgba(16,185,129,0.14); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .badge-unpaid { background: rgba(239,68,68,0.12);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }

        /* action bar */
        .action-bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .btn {
            padding: 10px 22px; border: none; border-radius: 9px;
            font-size: 13.5px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: 'Inter', sans-serif;
            display: inline-flex; align-items: center; gap: 7px;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-warning  { background: var(--warning); color: #1a1a2e; box-shadow: 0 4px 12px rgba(245,158,11,0.25); }
        .btn-whatsapp { background: #25D366; color: white; box-shadow: 0 4px 12px rgba(37,211,102,0.25); }

        /* spinner */
        .spinner-box { text-align: center; padding: 50px; color: var(--text-muted); }

        .spinner {
            border: 3px solid rgba(255,255,255,0.08);
            border-top: 3px solid var(--primary);
            border-radius: 50%; width: 42px; height: 42px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

        @media (max-width: 600px) {
            .login-card { padding: 30px 20px; }
            .rp-header  { padding: 18px 20px; }
            .rp-content { padding: 16px; }
            .action-bar .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN PAGE ===== -->
    <div id="loginPage">
        <div class="login-card">
            <div class="login-logo">🎓</div>
            <div class="login-title">
                <h1>SIPMINI</h1>
                <p>ගුරු පෝර්ටලය — Teacher Portal</p>
            </div>
            <div class="form-group">
                <label>ප්‍රවේශ කේතය</label>
                <input type="text" id="accessCode" placeholder="Access code ඇතුළත් කරන්න" autocomplete="username">
            </div>
            <div class="form-group">
                <label>මුරපදය</label>
                <input type="password" id="password" placeholder="මුරපදය ඇතුළත් කරන්න" autocomplete="current-password">
            </div>
            <button class="login-btn" id="loginBtn" onclick="doLogin()">පුරනය වන්න</button>
            <div class="error-box" id="errorBox"></div>
            <div class="info-pill">🔒 SHA-256 Encrypted Authentication</div>
        </div>
    </div>

    <!-- ===== REPORT PAGE ===== -->
    <div id="reportPage">
        <div class="rp-card">
            <div class="rp-header">
                <div class="rp-left">
                    <div class="rp-logo">🎓</div>
                    <div>
                        <div class="rp-tag">SIPMINI Teacher Portal</div>
                        <div class="rp-name" id="headerName">—</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="sessionStorage.removeItem('teacherSession'); window.location.reload();">
                    ↩ ඉවත්වන්න
                </button>
            </div>

            <div class="rp-content">
                <div id="loadingBox" class="spinner-box">
                    <div class="spinner"></div>
                    <p>වාර්තාව පූරණය වෙමින්...</p>
                </div>
                <div id="reportBody" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let teacher = null;

        /* ===== SHA-256 ===== */
        async function sha256(str) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
        }

        /* ===== ERROR ===== */
        function showError(msg) {
            const el = document.getElementById('errorBox');
            el.textContent = msg;
            el.style.display = 'block';
        }

        /* ===== LOGIN ===== */
        async function doLogin() {
            const code = document.getElementById('accessCode').value.trim().toLowerCase();
            const pw   = document.getElementById('password').value;
            const btn  = document.getElementById('loginBtn');

            document.getElementById('errorBox').style.display = 'none';
            if (!code || !pw) { showError('ප්‍රවේශ කේතය සහ මුරපදය ඇතුළත් කරන්න.'); return; }

            btn.disabled = true;
            btn.textContent = 'පරීක්ෂා කරමින්...';

            try {
                const { data, error } = await sb
                    .from('credentials_sipmini')
                    .select('*')
                    .ilike('access_code', code);

                if (error) throw error;

                if (!data || data.length === 0) {
                    showError('වැරදි ප්‍රවේශ කේතයකි!'); return;
                }

                const cred = data[0];

                if (!cred.is_active) {
                    showError('මෙම ගිණුම අක්‍රීය කර ඇත. පරිපාලකයා සම්බන්ධ කර ගන්න.'); return;
                }

                const inputHash = await sha256(pw);

                if (cred.password_hash !== inputHash) {
                    showError('වැරදි මුරපදයකි!');
                    document.getElementById('password').value = '';
                    return;
                }

                // update last_login silently
                sb.from('credentials_sipmini')
                  .update({ last_login: new Date().toISOString() })
                  .eq('id', cred.id).then(() => {});

                // save & show
                teacher = {
                    id: cred.id,
                    teachername: cred.teachername || code,
                    access_code: cred.access_code
                };
                sessionStorage.setItem('teacherSession', JSON.stringify(teacher));
                showReportPage();

            } catch(e) {
                showError('දෝෂයක් ඇතිවිය: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'පුරනය වන්න';
            }
        }

        /* ===== SHOW REPORT PAGE ===== */
        function showReportPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('reportPage').style.display = 'block';
            document.getElementById('headerName').textContent = teacher.teachername;
            loadReport();
        }

        /* ===== LOAD DATA ===== */
        async function loadReport() {
            try {
                const { data, error } = await sb
                    .from('sipminireport')
                    .select('*')
                    .eq('teachername', teacher.teachername);

                if (error) throw error;
                renderReport(data || []);
            } catch(e) {
                document.getElementById('loadingBox').innerHTML =
                    `<p style="color:#fca5a5;font-size:14px;">දෝෂයක් ඇතිවිය: ${e.message}</p>`;
            }
        }

        /* ===== RENDER ===== */
        function renderReport(students) {
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('reportBody').style.display = 'block';

            if (students.length === 0) {
                document.getElementById('reportBody').innerHTML =
                    `<div class="empty-state">📭<br><br>ඔබට assign කළ සිසුන් නොමැත.</div>`;
                return;
            }

            let paid = 0, unpaid = 0, totalPayment = 0;

            // teachers_balance: use first row's value (same for all rows of this teacher)
            const teacherBalance = parseFloat(students[0].teachers_balance) || 0;

            const rows = students.map((s, i) => {
                const treport = parseFloat(s.treport) || 0;
                const fee     = parseFloat(s.monthly_fee) || 0;
                const hasPaid = treport > 0;
                if (hasPaid) { paid++; totalPayment += treport; } else unpaid++;
                return `
                    <tr>
                        <td style="color:var(--text-muted);">${i+1}</td>
                        <td><strong>${s.studentname || '—'}</strong></td>
                        <td style="color:var(--text-muted);">${s.subject || '—'}</td>
                        <td>Rs. ${fee.toFixed(2)}</td>
                        <td><span class="badge ${hasPaid ? 'badge-paid':'badge-unpaid'}">${hasPaid ? '✓ ගෙවා ඇත':'✗ ගෙවා නැත'}</span></td>
                        <td><strong>Rs. ${treport.toFixed(2)}</strong></td>
                    </tr>`;
            }).join('');

            const remaining = totalPayment - teacherBalance;

            // Determine state
            let remainingClass, remainingLabel, remainingCardClass, remainingColor;
            if (remaining > 0) {
                remainingClass = 'remaining-row-pending';
                remainingLabel = '⚠️ ගෙවීමට ඉතිරි මුදල';
                remainingCardClass = 'remaining-card-pending';
                remainingColor = 'c-red';
            } else if (remaining < 0) {
                remainingClass = 'remaining-row-overpaid';
                remainingLabel = '✅ අතිරේකව ගෙවූ මුදල';
                remainingCardClass = 'remaining-card-overpaid';
                remainingColor = 'c-green';
            } else {
                remainingClass = 'remaining-row-settled';
                remainingLabel = '✅ සම්පූර්ණයෙන් ගෙවා ඇත';
                remainingCardClass = 'remaining-card-settled';
                remainingColor = 'c-green';
            }

            document.getElementById('reportBody').innerHTML = `
                <div class="teacher-bar">
                    <div class="teacher-avatar">👨‍🏫</div>
                    <div>
                        <div class="t-name">${teacher.teachername}</div>
                        <div class="t-code">Access Code: ${teacher.access_code}</div>
                    </div>
                </div>

                <div class="sum-grid">
                    <div class="sum-card">
                        <div class="sum-num c-indigo">${students.length}</div>
                        <div class="sum-lbl">සිසුන් සංඛ්‍යාව<br>Total Students</div>
                    </div>
                    <div class="sum-card">
                        <div class="sum-num c-green">${paid}</div>
                        <div class="sum-lbl">ගෙවා ඇත<br>Paid</div>
                    </div>
                    <div class="sum-card">
                        <div class="sum-num c-red">${unpaid}</div>
                        <div class="sum-lbl">ගෙවා නැත<br>Unpaid</div>
                    </div>
                    <div class="sum-card">
                        <div class="sum-num c-amber" style="font-size:17px;">Rs.${totalPayment.toFixed(2)}</div>
                        <div class="sum-lbl">ගෙවීම් එකතුව<br>Total (treport)</div>
                    </div>
                    <div class="sum-card">
                        <div class="sum-num c-cyan" style="font-size:17px;">Rs.${teacherBalance.toFixed(2)}</div>
                        <div class="sum-lbl">ගෙවූ මුදල<br>Paid to Teacher</div>
                    </div>
                    <div class="sum-card ${remainingCardClass}">
                        <div class="sum-num ${remainingColor}" style="font-size:17px;">Rs.${Math.abs(remaining).toFixed(2)}</div>
                        <div class="sum-lbl">${remainingLabel}</div>
                    </div>
                </div>

                <div class="tbl-section" id="reportTable">
                    <div class="tbl-head">
                        <h3>📋 ශිෂ්‍ය ගෙවීම් විස්තර — Student Payment Details</h3>
                    </div>
                    <div class="tbl-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>ශිෂ්‍ය නාමය</th>
                                    <th>විෂයය</th>
                                    <th>මාසික ගාස්තුව</th>
                                    <th>තත්ත්වය</th>
                                    <th>ගෙවීම (treport)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                                <tr class="total-row">
                                    <td colspan="5">🔢 එකතුව — Total Payment</td>
                                    <td>Rs. ${totalPayment.toFixed(2)}</td>
                                </tr>
                                <tr class="balance-row">
                                    <td colspan="5">💵 ගෙවූ මුදල — Paid to Teacher</td>
                                    <td>Rs. ${teacherBalance.toFixed(2)}</td>
                                </tr>
                                <tr class="${remainingClass}">
                                    <td colspan="5"><strong>${remainingLabel}</strong></td>
                                    <td><strong>Rs. ${Math.abs(remaining).toFixed(2)}</strong></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="action-bar">
                    <button class="btn btn-whatsapp" onclick="shareWA(${totalPayment}, ${teacherBalance}, ${remaining})">📱 WhatsApp Share</button>
                    <button class="btn btn-warning"  onclick="savePDF()">📄 PDF Save</button>
                </div>
            `;
        }

        /* ===== WHATSAPP ===== */
        function shareWA(totalPayment, teacherBalance, remaining) {
            let msg = `*SIPMINI Teacher Report*\n\n👨‍🏫 *${teacher.teachername}*\n━━━━━━━━━━━━━━━━\n`;
            document.querySelectorAll('#reportTable tbody tr:not(.total-row):not(.balance-row):not(.remaining-row-pending):not(.remaining-row-overpaid):not(.remaining-row-settled)').forEach(row => {
                const c = row.querySelectorAll('td');
                if (c.length >= 6)
                    msg += `• ${c[1].textContent.trim()} | ${c[2].textContent.trim()} | ${c[4].textContent.trim()} | ${c[5].textContent.trim()}\n`;
            });
            msg += `━━━━━━━━━━━━━━━━\n`;
            msg += `*Total: Rs. ${totalPayment.toFixed(2)}*\n`;
            msg += `*Paid to Teacher: Rs. ${teacherBalance.toFixed(2)}*\n`;
            if (remaining > 0)
                msg += `*⚠️ ගෙවීමට ඉතිරි: Rs. ${Math.abs(remaining).toFixed(2)}*\n`;
            else if (remaining < 0)
                msg += `*✅ අතිරේකව ගෙවූ: Rs. ${Math.abs(remaining).toFixed(2)}*\n`;
            else
                msg += `*✅ සම්පූර්ණයෙන් ගෙවා ඇත*\n`;
            msg += `\n_SIPMINI Portal_`;
            window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
        }

        /* ===== PDF ===== */
        function savePDF() {
            html2pdf().set({
                margin: 10,
                filename: `${teacher.teachername}_Report.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(document.getElementById('reportTable')).save();
        }

        /* ===== BOOT ===== */
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('accessCode').addEventListener('keypress', e => {
                if (e.key === 'Enter') document.getElementById('password').focus();
            });
            document.getElementById('password').addEventListener('keypress', e => {
                if (e.key === 'Enter') doLogin();
            });

            // restore session if exists
            try {
                const saved = sessionStorage.getItem('teacherSession');
                if (saved) {
                    teacher = JSON.parse(saved);
                    showReportPage();
                }
            } catch(e) {
                sessionStorage.removeItem('teacherSession');
            }
        });
    </script>
</body>
</html>
